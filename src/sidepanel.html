<!doctype html>
<!-- The AskFutures side panel: askfutures.com embedded next to the page, so a
     chart and AskFutures can sit side by side (see background.ts — on the
     charting sites in SIDE_PANEL_DOMAINS the toolbar click opens this instead
     of clipping). sidepanel.js bridges chart context (ticker, timeframe,
     indicators, last values) from the chart tab into the iframe, and the
     header's tabs swap the iframe between askfutures.com/sessions and
     askfutures.com/trading/reconcile — the live positions the chart next door
     is being traded against (each page owns all of its own state; the panel
     chrome stays this one slim bar). Whether the panel loads at all is the
     site's call, not the extension's: Chrome renders its own "refused to
     connect" page unless askfutures.com serves a frame-ancestors naming this
     extension's chrome-extension:// origin, and the signed-in session only
     carries into the frame if those cookies are SameSite=None — a panel is a
     cross-site context, host permission notwithstanding. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AskFutures</title>
    <style>
      /* Two palettes in one: the :root values are the panel's own look, used
         whenever it opens next to a site that hands over no theme. When the
         chart tab does hand one over, sidepanel.js overwrites these same
         custom properties with that site's live values, so the panel restyles
         itself without a second stylesheet. Everything below therefore reads
         from a variable — a literal colour here is a colour that can never
         match the site next door. */
      :root {
        --af-font: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --af-background: #0f1626;
        --af-surface: #0f1626;
        --af-divider: rgba(255, 255, 255, 0.08);
        --af-text: #e8edf6;
        --af-text-dim: #8a97ad;
        --af-accent: #3b82f6;
        --af-tab-height: 26px;
        --af-tab-padding-inline: 10px;
        --af-tab-radius: 6px;
        --af-tab-active-bg: rgba(59, 130, 246, 0.22);
        --af-tab-active-text: #e8edf6;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--af-background);
        display: flex;
        flex-direction: column;
      }
      nav {
        display: flex;
        gap: 4px;
        padding: 6px 8px;
        background: var(--af-surface);
        border-bottom: 1px solid var(--af-divider);
        font: 12px/1 var(--af-font);
      }
      nav button {
        border: 0;
        border-radius: var(--af-tab-radius);
        /* The height is the site's tab height when one was handed over, which
           is a line-box height rather than a padded one — hence padding on the
           inline axis only, with the block axis left to the height. */
        height: var(--af-tab-height);
        padding: 0 var(--af-tab-padding-inline);
        background: none;
        color: var(--af-text-dim);
        font: inherit;
        cursor: pointer;
      }
      nav button:hover {
        color: var(--af-text);
        background: var(--af-row-hover, rgba(255, 255, 255, 0.08));
      }
      nav button.active {
        color: var(--af-tab-active-text);
        background: var(--af-tab-active-bg);
      }
      iframe {
        display: block;
        border: 0;
        width: 100%;
        flex: 1;
        background: var(--af-background);
      }
    </style>
  </head>
  <body>
    <nav>
      <button type="button" data-view="sessions" class="active">Sessions</button>
      <button type="button" data-view="reconcile">Strategy Reconciliation</button>
    </nav>
    <iframe src="https://askfutures.com/sessions" title="AskFutures" allow="clipboard-write"></iframe>
    <script src="sidepanel.js"></script>
  </body>
</html>
